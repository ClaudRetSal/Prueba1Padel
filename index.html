<html lang="es">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PADNET</title>

<script defer src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js" onerror="window.__sdkFallo=(window.__sdkFallo||0)+1"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js" onerror="window.__sdkFallo=(window.__sdkFallo||0)+1"></script>

<style>
:root{
  color-scheme:light;
  --bg:#0a5794; --bg2:#0b66a8; --card:#0c4b7c; --card-b:#2798e5;
  --txt:#f7fbff; --mut:#d7edff; --acc:#e5ff00; --acc-d:#cfff00; --acc-soft:#245f87;
  --amber:#e5ff00; --amber-d:#0b4777; --amber-soft:#2b6890;
  --navy:#084678; --navy2:#0b68a9; --blue:#0788e8; --bad:#ff5d75;
  --shadow:0 10px 28px rgba(0,36,75,.20),0 1px 2px rgba(0,25,55,.12);
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(ellipse at 50% -15%,#1686ce 0%,#0d67a8 38%,#084579 100%);color:var(--txt);min-height:100%;-webkit-font-smoothing:antialiased;line-height:1.55}
header{padding:15px clamp(16px,3vw,32px);background:linear-gradient(110deg,#074779 0%,#0b65a5 48%,#084778 100%);border-bottom:1px solid #45b5ff;display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:10;padding-top:calc(15px + env(safe-area-inset-top,0));box-shadow:0 7px 22px rgba(0,39,78,.20);backdrop-filter:blur(14px)}
header img{min-width:0;max-width:min(100%,220px);height:auto;flex-shrink:1;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(0,36,70,.16))}
#ginfo{text-align:right;white-space:normal;overflow-wrap:anywhere;font-size:12px;color:#e8f6ff}
header h1{font-size:clamp(18px,2vw,23px);margin:0;font-weight:800;letter-spacing:-.045em;color:#fff;line-height:1.15}
header h1 span{color:var(--acc)}
nav{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;padding:12px clamp(12px,3vw,28px);background:linear-gradient(100deg,#0a5791,#0d70b3 55%,#0a5791);scrollbar-width:thin;scrollbar-color:#70c8ff transparent;max-width:1200px;margin:0 auto;border-bottom:1px solid #39a7f0}
nav button{background:#1269a5;border:1px solid #3aa6ed;color:#f7fbff;padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:700;transition:color .18s ease,border-color .18s ease,background .18s ease,transform .18s ease;min-height:42px}
nav button:hover{color:#092f52;border-color:#efff4b;background:#dfff16;transform:translateY(-1px)}
nav button.on{background:linear-gradient(110deg,#e5ff00,#d3f800);border-color:#f1ff55;color:#07355d;box-shadow:0 4px 14px rgba(0,45,90,.16);position:relative}
nav button.on:after{content:"";position:absolute;left:18%;right:18%;bottom:3px;height:2px;border-radius:2px;background:#087ac7}
main{padding:clamp(12px,2.5vw,26px) clamp(12px,3vw,28px) 42px;max-width:1200px;margin:0 auto;width:100%}
.card{background:linear-gradient(145deg,rgba(15,91,145,.98),rgba(9,68,116,.98));border:1px solid var(--card-b);border-radius:14px;padding:clamp(16px,2.5vw,26px);margin-bottom:18px;box-shadow:var(--shadow);min-width:0;overflow-wrap:anywhere;position:relative;color:var(--txt)}
.card h3{padding-left:12px;border-left:4px solid var(--acc);color:#fff}
label{display:block;font-size:11px;font-weight:750;color:#e8f6ff;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.065em}
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),select,textarea{width:100%;min-width:0;padding:12px 13px;border-radius:9px;border:1px solid #65cfff;background:#bfeaff;color:#000000;font-size:14px;font-family:inherit;transition:border-color .18s,box-shadow .18s,background .18s;min-height:44px}
input:not([type="checkbox"]):not([type="radio"]):not([type="file"])::placeholder,textarea::placeholder{color:#354b59;opacity:.85}
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):hover,select:hover,textarea:hover{border-color:#0788e8;background:#d5f3ff;color:#000000}
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):focus,select:focus,textarea:focus{outline:none;border-color:#0788e8;background:#e5f8ff;color:#000000;box-shadow:0 0 0 3px rgba(7,136,232,.22)}
select option{background:#c9efff;color:#000000}
button{font-family:inherit}
button.btn{background:linear-gradient(110deg,#e5ff00,#d8f900);border:1px solid #eaff33;color:#08345b;padding:11px 18px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer;margin-top:12px;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;box-shadow:0 4px 12px rgba(0,36,70,.18);min-height:42px}
button.btn:hover{background:#f0ff63;border-color:#f0ff63;box-shadow:0 0 0 3px rgba(229,255,0,.18);transform:translateY(-1px)}
button.btn:active{transform:scale(.985)}
button.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button.btn.sec{background:linear-gradient(110deg,#0879c8,#1596e8);border:1px solid #65c6ff;color:#fff;box-shadow:0 4px 12px rgba(0,36,70,.16)}
button.btn.sec:hover{background:linear-gradient(110deg,#1596e8,#42b4ff);border-color:#b2e7ff;color:#fff}
button.btn.del{background:#c83d59;border:1px solid #ff8a9d;color:#fff;box-shadow:none}
button.btn.del:hover{background:#e44c68;color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1 1 180px;min-width:0}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;margin-top:10px;overflow:hidden;border:1px solid var(--card-b);border-radius:10px;background:#eaf8ff;color:#153d5c}
th{color:#fff;font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.065em;background:linear-gradient(100deg,#0873b9,#1495e5)}
td,th{padding:11px 12px;border-bottom:1px solid #b7e3fa;text-align:left;vertical-align:middle}
tbody tr:nth-child(even),table tr:nth-child(even){background:#d9f1ff}
tbody tr:hover{background:#c5eaff}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--acc);color:#08213a;font-size:11px;font-weight:800;line-height:1.4}
.day{border:1px solid #48b0f1;border-left:4px solid var(--acc);border-radius:10px;padding:15px 16px;margin:12px 0;background:linear-gradient(110deg,#1269a5,#0b4f83)}
.msg{color:var(--mut);font-size:13px;line-height:1.55}
.err{color:#ffd5dc;font-size:13px;font-weight:700}
h2,h3,h4{color:#fff}
h3{margin:0 0 12px;font-weight:800;font-size:clamp(16px,2vw,19px);letter-spacing:-.025em;line-height:1.3}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0}
.chk input{width:18px;height:18px;min-height:0;accent-color:#dfff16;flex:0 0 auto}
.ov{position:fixed;inset:0;background:rgba(4,38,70,.72);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
@media(min-width:760px){header{padding-left:max(28px,calc((100vw - 1200px)/2));padding-right:max(28px,calc((100vw - 1200px)/2))}main{padding-top:24px}.card{border-radius:14px}nav{padding-top:12px;padding-bottom:12px}}
@media(max-width:600px){header{gap:10px;padding-left:14px;padding-right:14px}header img{max-width:145px;max-height:52px}header h1{font-size:17px}#ginfo{font-size:11px;max-width:48%;line-height:1.35}nav{padding:10px 12px;gap:6px}nav button{padding:9px 13px;font-size:12px;min-height:38px}main{padding:8px 10px 28px}.card{padding:15px;border-radius:11px;margin-bottom:13px}.row{gap:8px}.row>div{flex:1 1 130px}td,th{padding:9px 7px;font-size:12px}th{font-size:9px}button.btn{width:auto;max-width:100%;padding:10px 14px}.day{padding:12px;border-radius:9px}}
@media(max-width:380px){header img{max-width:112px}#ginfo{font-size:10px}.row>div{flex-basis:100%}.card{padding:12px}td,th{padding:8px 5px;font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* Ajustes solicitados: texto negro en horarios de jugadores y nombre del jugador en estadísticas */
#h1, #h2, #st-rut {
  color: #000000 !important;
  background-color: #bfeaff !important;
}
#h1 option, #h2 option, #st-rut option {
  color: #000000 !important;
  background-color: #dff5ff !important;
}

/* PADNET: texto negro en Nivel y Posición del formulario Agregar jugador */
#j-nivel,
#j-posicion,
#j-nivel option,
#j-posicion option {
  color: #000000 !important;
  background-color: #bfeaff !important;
  -webkit-text-fill-color: #000000;
}
#j-nivel:focus,
#j-posicion:focus {
  color: #000000 !important;
  background-color: #e5f8ff !important;
}
</style>
</head>

// Firestore no admite arrays dentro de arrays ni valores undefined:
// se codifican al guardar y se restauran al leer, sin tocar el resto de la app.
function codificar(v){
  if(Array.isArray(v)) return v.map(x=>Array.isArray(x)?{_arr:codificar(x)}:codificar(x));
  if(v && typeof v==="object"){ const o={}; for(const k of Object.keys(v)){ if(v[k]!==undefined) o[k]=codificar(v[k]); } return o; }
  return v;
}
function decodificar(v){
  if(Array.isArray(v)) return v.map(decodificar);
  if(v && typeof v==="object"){
    const ks=Object.keys(v);
    if(ks.length===1 && ks[0]==="_arr") return decodificar(v._arr);
    const o={}; for(const k of ks) o[k]=decodificar(v[k]); return o;
  }
  return v;
}
function crearDbFirestore(firestore){
  const envDoc=ref=>({
    async get(){ const s=await ref.get(); return {exists:s.exists, id:s.id, data:()=>s.exists?decodificar(s.data()):undefined}; },
    async set(d){ return ref.set(codificar(d)); },
    async delete(){ return ref.delete(); }
  });
  return {
    doc:path=>envDoc(firestore.doc(path)),
    collection:path=>({ async get(){
      const q=await firestore.collection(path).get();
      return {docs:q.docs.map(d=>({id:d.id, exists:true, data:()=>decodificar(d.data())})), size:q.size, empty:q.empty};
    }})
  };
}

const FUENTES_SDK=[
  ["https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js","https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"],
  ["https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1-20240827161511/firebase-app-compat.min.js","https://cdnjs.cloudflare.com/ajax/libs/firebase/10.13.1-20240827161511/firebase-firestore-compat.min.js"]
];
function cargarScript(url){
  return new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src=url;
    const t=setTimeout(()=>{ s.remove(); rej(new Error("tiempo agotado descargando "+url)); }, ESPERA_SCRIPT_MS);
    s.onload=()=>{ clearTimeout(t); res(url); };
    s.onerror=()=>{ clearTimeout(t); s.remove(); rej(new Error("no se pudo descargar "+url)); };
    document.head.appendChild(s);
  });
}
async function esperarFirebase(ms){
  const fin=Date.now()+ms;
  while(Date.now()<fin){
    if(typeof firebase!=="undefined" && firebase.firestore) return true;
    if(window.__sdkFallo) return false;
    await new Promise(r=>setTimeout(r,150));
  }
  return typeof firebase!=="undefined" && !!firebase.firestore;
}
async function cargarSDK(){
  if(!sdkEsperado){ sdkEsperado=true; if(await esperarFirebase(ESPERA_SDK_MS)) return; }
  else if(typeof firebase!=="undefined" && firebase.firestore) return;
  const fallos=[];
  for(const [appUrl,fsUrl] of FUENTES_SDK){
    try{
      if(typeof firebase==="undefined") await cargarScript(appUrl);
      await cargarScript(fsUrl);
      if(firebase.firestore) return;
      fallos.push("cargó pero no definió Firestore: "+fsUrl);
    }catch(e){ fallos.push(e.message); }
  }
  throw new Error("No se cargó el SDK de Firebase | "+fallos.join(" | "));
}

let firestoreConfigurado=false;
function conTimeout(promesa,ms){
  let t; const limite=new Promise((_,rej)=>{ t=setTimeout(()=>rej(new Error("Tiempo de espera agotado ("+Math.round(ms/1000)+" s) al conectar con Firestore")),ms); });
  return Promise.race([promesa,limite]).finally(()=>clearTimeout(t));
}
function mostrarErrorConexion(e){
  const code=(e&&e.code)||""; const msg=(e&&e.message)||String(e);
  let ayuda="";
  if(code==="permission-denied") ayuda="Las reglas de seguridad de Firestore no permiten leer. Revisa la pestaña Reglas en la consola de Firebase.";
  else if(/SDK de Firebase/.test(msg)) ayuda="El navegador no pudo descargar Firebase desde ninguna de las fuentes (gstatic.com y cdnjs). Suele ser un bloqueador de anuncios o privacidad, una red con filtros o falta de conexión. Prueba en una ventana de incógnito sin extensiones, o desde otra red.";
  else if(code==="unavailable"||/Tiempo de espera/.test(msg)) ayuda="No se pudo alcanzar Firestore. Revisa tu conexión o si una red o extensión bloquea firestore.googleapis.com.";
  document.getElementById("app").innerHTML=`<div class="card err">No se pudo conectar con la base de datos.
    <div class="msg" style="margin-top:8px">${code?code+": ":""}${msg.replace(/ \| /g,"<br>")}</div>
    ${ayuda?`<div class="msg" style="margin-top:6px">${ayuda}</div>`:""}
    <button class="btn" onclick="init()">Reintentar</button></div>`;
}
async function conectarFirestore(){
  const app=document.getElementById("app");
  app.innerHTML=`<div class="card"><div class="msg">Conectando con la base de datos…</div></div>`;
  let ultimoError=null;
  for(let i=1;i<=INTENTOS_CONEXION;i++){
    try{
      await cargarSDK();
      if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      const firestore=firebase.firestore(); // única instancia; db es un envoltorio fino sobre ella
      if(!firestoreConfigurado){ try{ firestore.settings({experimentalAutoDetectLongPolling:true}); }catch(e){ console.warn(e); } firestoreConfigurado=true; }
      await conTimeout(firestore.collection("groups").limit(1).get(), ESPERA_CONEXION_MS);
      db=crearDbFirestore(firestore);
      return true;
    }catch(e){
      ultimoError=e;
      console.error(`Firestore: intento ${i} de ${INTENTOS_CONEXION} falló`, e);
      if(i<INTENTOS_CONEXION){
        app.innerHTML=`<div class="card"><div class="msg">Conectando con la base de datos… (reintento ${i} de ${INTENTOS_CONEXION-1})</div></div>`;
        await new Promise(r=>setTimeout(r,1500*i));
      }
    }
  }
  mostrarErrorConexion(ultimoError);
  return false;
}

const DIA_KEYS={"Lunes":"lunes","Martes":"martes","Miércoles":"miercoles","Jueves":"jueves","Viernes":"viernes","Sábado":"sabado","Domingo":"domingo"};

function horaOptions(){const o=[];for(let h=0;h<24;h++)for(const m of [0,30])o.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);return o;}

async function init(){
  if(await conectarFirestore()) render();
}

function setTab(t){ location.hash=t; render(); }
function nav(){
  const tabs = gid? [["reservas","Reservas"],["resultados","Resultados"],["stats","Estadísticas"]] : [];
  const base = [["inicio","Inicio"]].concat(tabs).concat(gid&&isAdmin?[["jugadores","Jugadores"]]:[]).concat([["config","⚙️ Configuración"]]);
  document.getElementById("nav").innerHTML = base.map(([k,l])=>`<button onclick="setTab('${k}')" class="${(location.hash.slice(1)||'inicio')===k?'on':''}">${l}</button>`).join("");
  document.getElementById("ginfo").innerHTML = group? `<div>Grupo: ${group.nombre}</div><div>ID: ${gid}${isAdmin?' · Admin':me?` · ${me.nombre}`:''}</div>` : "";
}

async function render(){
  nav();
  const tab = location.hash.slice(1) || "inicio";
  const app = document.getElementById("app");
  if(!db) return;
  try{
    if(tab==="inicio") return await renderInicio();
    if(tab==="config") return await renderConfig();
    if(!gid){ location.hash="inicio"; return await renderInicio(); }
    if(tab==="jugadores") return await renderJugadores();
    if(tab==="reservas") return await renderReservas();
    if(tab==="resultados") return await renderResultados();
    if(tab==="stats") return await renderStats();
  }catch(err){
    console.error(err);
    app.innerHTML = `<div class="card err">Ocurrió un error al cargar esta sección (${(err&&err.message)||err}). Intenta recargar la página.</div>`;
  }
}

async function cargarListaGrupos(){
  const cont=document.getElementById("lista-grupos");
  const sel=document.getElementById("cfg-respaldo-grupo");
  if(!cont && !sel) return;
  const snap=await db.collection("groups").get();
  if(cont){
    if(!snap.docs.length){ cont.innerHTML=`<h3>Grupos existentes</h3><div class="msg">Aún no hay grupos creados.</div>`; }
    else cont.innerHTML=`<h3>Grupos existentes (${snap.docs.length})</h3><table>
      <tr><th>Nombre</th><th>ID</th><th>Clave admin</th><th></th></tr>
      ${snap.docs.map(d=>`<tr><td>${d.data().nombre}</td><td>${d.id}</td><td>${d.data().claveAdmin}</td>
        <td><button class="btn del" onclick="borrarGrupoCompleto('${d.id}')">Borrar grupo</button></td></tr>`).join("")}
      </table>`;
  }
  if(sel){
    sel.innerHTML = snap.docs.length? snap.docs.map(d=>`<option value="${d.id}">${d.data().nombre} (${d.id})</option>`).join("") : `<option value="">Sin grupos</option>`;
  }
}

async function exportarDatosGrupo(targetGid){
  targetGid=targetGid||gid;
  if(!targetGid){ appAlert("Selecciona un grupo primero.",true); return; }
  const data={grupo:null,jugadores:[],reservas:[],partidos:[],stats:[]};
  const gSnap=await db.doc(`groups/${targetGid}`).get();
  data.grupo=gSnap.exists?{id:targetGid,...gSnap.data()}:null;
  for(const sub of ["jugadores","reservas","partidos","stats"]){
    const snap=await db.collection(`groups/${targetGid}/${sub}`).get();
    data[sub]=snap.docs.map(d=>({id:d.id,...d.data()}));
  }
  try{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`padnet-${targetGid}-backup.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(err){
    appAlert("No se pudo descargar el respaldo: "+((err&&err.message)||err),true);
  }
}

async function importarDatosGrupo(input,targetGid){
  const file=input.files[0]; if(!file) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    const destino=targetGid||data.grupo?.id||gid;
    if(!destino){ appAlert("Selecciona un grupo de destino primero.",true); return; }
    if(data.grupo){ const {id,...gdata}=data.grupo; await db.doc(`groups/${destino}`).set(gdata); }
    for(const sub of ["jugadores","reservas","partidos","stats"]){
      for(const doc of (data[sub]||[])){ const {id,...ddata}=doc; await db.doc(`groups/${destino}/${sub}/${id}`).set(ddata); }
    }
    appAlert(`Datos importados correctamente al grupo ${destino}.`);
    render();
  }catch(err){
    appAlert("No se pudo importar el archivo: "+((err&&err.message)||err),true);
  }
}

async function borrarGrupoCompleto(id){
  if(!(await appConfirm(`¿Borrar por completo el grupo ${id}? Esto eliminará jugadores, reservas, partidos y estadísticas. Esta acción no se puede deshacer.`))) return;
  try{
    for(const sub of ["jugadores","reservas","partidos","stats"]){
      const snap=await db.collection(`groups/${id}/${sub}`).get();
      for(const d of snap.docs){ await db.doc(`groups/${id}/${sub}/${d.id}`).delete(); }
    }
    await db.doc(`groups/${id}`).delete();
    const check=await db.doc(`groups/${id}`).get();
    if(check.exists){ appAlert("El grupo no se pudo borrar (sigue existiendo tras el intento). Puede ser un problema de permisos de edición sobre esta página.",true); return; }
    if(gid===id){ gid=null; group=null; me=null; isAdmin=false; }
  }catch(err){
    appAlert("No se pudo borrar el grupo: "+((err&&err.message)||err),true);
    return;
  }
  render();
}

async function crearPerfilAdmin(){
  if(!configDesbloqueado) return;
  const g=id=>document.getElementById(id).value.trim();
  const rut=g("ap-rut");
  if(!rut||!g("ap-nombre")||!g("ap-clave")){ document.getElementById("ap-msg").textContent="Completa al menos nombre, RUT y clave."; return; }
  const ref=db.doc(`administradores/${rut}`);
  const cur=await ref.get();
  if(cur.exists){ document.getElementById("ap-msg").textContent="Ya existe un perfil con ese RUT. Usa 'Ya tengo un perfil' para ingresar."; return; }
  const perfil={nombre:g("ap-nombre"),apellidos:g("ap-apellidos"),rut,telefono:g("ap-telefono"),clave:g("ap-clave"),pago:g("ap-pago"),pais:g("ap-pais"),ciudad:g("ap-ciudad"),comuna:g("ap-comuna")};
  await ref.set(perfil);
  adminPerfil=perfil;
  render();
}

async function ingresarPerfilAdmin(){
  if(!configDesbloqueado) return;
  const rut=document.getElementById("api-rut").value.trim();
  const clave=document.getElementById("api-clave").value;
  const ref=db.doc(`administradores/${rut}`);
  const snap=await ref.get();
  if(!snap.exists || snap.data().clave!==clave){ document.getElementById("api-msg").textContent="RUT o clave incorrectos."; return; }
  adminPerfil=snap.data();
  render();
}

function desbloquearConfig(){
  const v=document.getElementById("cfg-acceso").value.trim();
  if(v!==CODIGO_AUTORIZACION_ADMIN){ document.getElementById("cfg-acceso-msg").textContent="Clave de autorización incorrecta."; return; }
  configDesbloqueado=true;
  render();
}

function bloquearConfig(){
  configDesbloqueado=false;
  render();
}

function cerrarSesionAdmin(){
  adminPerfil=null;
  configDesbloqueado=false;
  render();
}

async function crearGrupo(){
  const nombre=document.getElementById("ng-nombre").value.trim();
  const clave=document.getElementById("ng-clave").value;
  if(!nombre||!clave){document.getElementById("ng-msg").textContent="Completa nombre y clave.";return;}
  const id=uid();
  await db.doc(`groups/${id}`).set({nombre,claveAdmin:clave,createdAt:Date.now()});
  gid=id; group={nombre,claveAdmin:clave}; isAdmin=true; me=null;
  location.hash="jugadores"; render();
}

async function ingresarGrupo(){
  const id=document.getElementById("ig-id").value.trim().toUpperCase();
  const clave=document.getElementById("ig-clave").value;
  const rut=document.getElementById("ig-rut").value.trim();
  const msg=document.getElementById("ig-msg");
  if(!id||!clave){msg.textContent="Completa ID y clave.";return;}
  const snap=await db.doc(`groups/${id}`).get();
  if(!snap.exists){msg.textContent="Grupo no encontrado.";return;}
  const g=snap.data();
  if(!rut){
    if(clave!==g.claveAdmin){msg.textContent="Clave de administrador incorrecta.";return;}
    gid=id;group=g;isAdmin=true;me=null;location.hash="jugadores";render();return;
  }
  const jsnap=await db.doc(`groups/${id}/jugadores/${rut}`).get();
  if(!jsnap.exists||jsnap.data().clave!==clave){msg.textContent="RUT o clave incorrectos.";return;}
  gid=id;group=g;isAdmin=false;me=jsnap.data();location.hash="reservas";render();
}

async function guardarHorarios(){
  const h1=document.getElementById("h1").value, h2=document.getElementById("h2").value;
  const ref=db.doc(`groups/${gid}`);
  const cur=await ref.get(); const data=cur.exists?cur.data():{};
  await ref.set({...data, horarios:[h1,h2]});
  group={...group, horarios:[h1,h2]};
  render();
}

async function agregarJugador(){
  const g=id=>document.getElementById(id).value.trim();
  const rut=g("j-rut");
  if(!rut||!g("j-nombre")||!g("j-clave")){document.getElementById("j-msg").textContent="Completa nombre, RUT y clave.";return;}
  await db.doc(`groups/${gid}/jugadores/${rut}`).set({
    nombre:g("j-nombre"),apellidos:g("j-apellidos"),rut,telefono:g("j-telefono"),
    categoria:g("j-categoria"),nivel:document.getElementById("j-nivel").value,
    posicion:document.getElementById("j-posicion").value,clave:g("j-clave")});

  const statsSnap=await statsRef.get();
  if(!statsSnap.exists) await statsRef.set({sets:0,juegos:0,partidos:0});
  render();
}

    if(horarios.length===0){
      if(ruts.length>0) diasHtml+=await renderSesionHtml(wk,dia,cLabel,ruts,jugadores,isAdmin);
    } else {
      const bloquesHor=[];
      for(let h=0;h<horarios.length;h++){
        const rutsH=ruts.filter(r=>(horMapDia[r]||[])[h]===true);
        if(rutsH.length>0) bloquesHor.push(await renderSesionHtml(wk,`${dia}__${h}`,`${horarios[h]}`,rutsH,jugadores,isAdmin));
      }
      if(bloquesHor.length){
        diasHtml+=`<div class="msg" style="margin:10px 0 2px;font-weight:700">${cLabel}</div>`+bloquesHor.join("");
      }
    }
  }
  if(!diasHtml) diasHtml=`<div class="msg">Todavía no hay jugadores inscritos esta semana.</div>`;
  const rango=`${cal[0].label} al ${cal[6].label}`;
  app.innerHTML = nombreHeader + inscHtml + `<div class="card"><h3>Partidos de la semana (${rango})</h3>${diasHtml}</div>`;
}

function calcRonda3(round1, round2){
  const key=(a,b)=>a<b?`${a}-${b}`:`${b}-${a}`;
  const jugados=new Set([
    key(round1.cancha1.a,round1.cancha1.b), key(round1.cancha2.a,round1.cancha2.b),
    key(round2.cancha1.a,round2.cancha1.b), key(round2.cancha2.a,round2.cancha2.b)
  ]);
  const todas=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
  const faltantes=todas.filter(([a,b])=>!jugados.has(key(a,b)));
  return {cancha1:{a:faltantes[0][0],b:faltantes[0][1],juegosA:0,juegosB:0,ganador:null},
          cancha2:{a:faltantes[1][0],b:faltantes[1][1],juegosA:0,juegosB:0,ganador:null}};
}

function calcAcumuladoGrupal(rondas){
  const acc={};
  for(const rd of rondas){
    for(const ck of ['cancha1','cancha2']){
      const c=rd[ck]; if(c.ganador==null) continue;
      acc[c.a]=acc[c.a]||{j:0,jp:0,s:0}; acc[c.b]=acc[c.b]||{j:0,jp:0,s:0};
      acc[c.a].j+=c.juegosA; acc[c.a].jp+=c.juegosB; if(c.ganador==='a') acc[c.a].s+=1;
      acc[c.b].j+=c.juegosB; acc[c.b].jp+=c.juegosA; if(c.ganador==='b') acc[c.b].s+=1;
    }
  }
  return acc;
}
async function actualizarStatsGrupal(parejas, rondas){
  const acc=calcAcumuladoGrupal(rondas);
  for(const idx of Object.keys(acc)){
    const pr=parejas[idx];
    for(const rut of pr){ if(rut) await sumarStats(rut, acc[idx].s, acc[idx].j, acc[idx].jp, 1); }
  }
}

  const horariosList=(gSnapR.exists?gSnapR.data().horarios:null)||[];
  let html="";
  for(const diaBase of DIAS){

      html+=`<div class="day"><b>${cLabel}</b> <span class="msg">(Hexagonal grupal — 3 canchas, round-robin de 5 rondas)</span>`;
      if(parejas.length<6){ html+=`<div class="msg">Faltan parejas por formar (${parejas.length}/6).</div></div>`; continue; }
      const resultadosHex=pdata.resultadosHex||HEX_SCHEDULE.map(r=>r.map(()=>({juegosA:0,juegosB:0,ganador:null})));
      HEX_SCHEDULE.forEach((ronda,ri)=>{
        html+=`<div style="margin-top:8px"><b>Ronda ${ri+1}</b></div>`;

          const res=resultadosHex[ri][ci];

          <div class="row"><div><label>Juegos ${pn(a)}</label><input type="number" min="0" id="hx-${ri}-${ci}-a-${dia}" value="${res.juegosA}"></div>

        });
      });

      if(pdata.resultadosHex){
        const acc=calcAcumuladoHex(pdata.resultadosHex);
        const ranking=[0,1,2,3,4,5].map(idx=>({idx,...(acc[idx]||{j:0,jp:0,s:0}),dif:((acc[idx]||{j:0,jp:0}).j-(acc[idx]||{j:0,jp:0}).jp)}))

        </table>`;

      html+="</div>";

    }
    if(pdata.tipo==='Octogonal' && pdata.modalidad==='grupal'){
      html+=`<div class="day"><b>${cLabel}</b> <span class="msg">(Octogonal grupal — 2 cuadrangulares independientes)</span>`;
      if(parejas.length<8){ html+=`<div class="msg">Faltan parejas por formar (${parejas.length}/8).</div></div>`; continue; }
      const rondasOcto=pdata.rondasOcto||[null,null];
      for(let g=0; g<2; g++){
        const subset=parejas.slice(g*4,g*4+4);
        const pnG=idx=>{const pr=subset[idx];return pr?`${nom(pr[0])}/${nom(pr[1])}`:'--';};
        html+=renderBloqueCuadrangular(pnG,wk,dia,`Cuadrangular ${g+1}`,rondasOcto[g],`go${g}`,
          `guardarRondaOcto1('${wk}','${dia}',${g})`,`guardarRondaOcto2('${wk}','${dia}',${g})`,`guardarRondaOcto3('${wk}','${dia}',${g})`);
      }
      html+="</div>";
      continue;
    }
    if(pdata.modalidad==='grupal'){
      html+=`<div class="day"><b>${cLabel}</b> <span class="msg">(Cuadrangular grupal — 2 canchas, 2 rondas, 1 set c/u)</span>`;
      if(parejas.length<4){ html+=`<div class="msg">Faltan parejas por formar (${parejas.length}/4).</div></div>`; continue; }
      html+=renderBloqueCuadrangular(pn,wk,dia,'',pdata.rondas,'g',
        `guardarRonda1('${wk}','${dia}')`,`guardarRonda2('${wk}','${dia}')`,`guardarRonda3('${wk}','${dia}')`);
      html+="</div>";
      continue;
    }
    const res=pdata.resultados||[];
    const nSets=SETS_TIPO[pdata.tipo]||3;
    html+=`<div class="day"><b>${cLabel}</b> <span class="msg">(${pdata.tipo||'Normal'} — mejor de ${nSets} sets)</span>`;
    for(let p=0;p<parejas.length/2;p++){
      const pa=parejas[p*2], pb=parejas[p*2+1];
      const r=res[p]||{};
      let sets=r.sets||[];
      while(sets.length<nSets) sets=sets.concat([{a:0,b:0}]);
      html+=`<div style="margin-top:6px">Partido ${p+1}: ${nom(pa[0])}/${nom(pa[1])} vs ${nom(pb[0])}/${nom(pb[1])}
      ${sets.slice(0,nSets).map((s,si)=>`<div class="row"><div><label>Set ${si+1} — juegos pareja A</label><input type="number" min="0" id="s${si}a-${dia}-${p}" value="${s.a}"></div>
        <div><label>Set ${si+1} — juegos pareja B</label><input type="number" min="0" id="s${si}b-${dia}-${p}" value="${s.b}"></div></div>`).join("")}
      ${r.ganador?`<span class="tag">Sets: ${r.setsA||0}-${r.setsB||0} · Ganó: ${r.ganador==='A'?nom(pa[0])+'/'+nom(pa[1]):nom(pb[0])+'/'+nom(pb[1])}</span>`:''}</div>`;
    }
    html+=`<button class="btn sec" onclick="guardarResultados('${wk}','${dia}',${Math.floor(parejas.length/2)},${nSets})">Guardar resultados de ${dia}</button></div>`;
    }
  }
  const rango=`${cal[0].label} al ${cal[6].label}`;
  app.innerHTML = `<div class="card"><h3>Resultados — semana ${rango}</h3>${html||'<div class="msg">No hay partidos formados aún.</div>'}</div>`;
}

async function guardarResultados(wk,dia,nPartidos,nSets){
  const ref=db.doc(`groups/${gid}/partidos/${wk}_${diaKey(dia)}`);
  const snap=await ref.get(); const data=snap.data(); const parejas=data.parejas;
  const oldResultados=data.resultados||[];
  for(let p=0;p<nPartidos;p++){
    const old=oldResultados[p];
    if(old && old.ganador){
      const pa=parejas[p*2], pb=parejas[p*2+1];
      for(const rut of pa){ if(rut) await restarStats(rut,old.setsA||0,old.juegosA||0,old.juegosB||0); }
      for(const rut of pb){ if(rut) await restarStats(rut,old.setsB||0,old.juegosB||0,old.juegosA||0); }
    }
  }
  const resultados=[];
  for(let p=0;p<nPartidos;p++){
    const sets=[]; let setsA=0,setsB=0,juegosA=0,juegosB=0;
    for(let si=0;si<nSets;si++){
      const a=+document.getElementById(`s${si}a-${dia}-${p}`).value||0;
      const b=+document.getElementById(`s${si}b-${dia}-${p}`).value||0;
      sets.push({a,b}); juegosA+=a; juegosB+=b;
      if(a!==b || a>0 || b>0){ if(a>b) setsA++; else if(b>a) setsB++; }
    }
    let ganador = setsA>setsB?'A':setsB>setsA?'B':null;
    resultados.push({sets,setsA,setsB,juegosA,juegosB,ganador});
    const pa=parejas[p*2], pb=parejas[p*2+1];
    for(const rut of pa){ if(rut) await sumarStats(rut,setsA,juegosA,juegosB); }
    for(const rut of pb){ if(rut) await sumarStats(rut,setsB,juegosB,juegosA); }
  }
  await ref.set({parejas,resultados});
  render();
}
async function guardarHexagonal(wk,dia){
  const ref=db.doc(`groups/${gid}/partidos/${wk}_${diaKey(dia)}`);
  const cur=await ref.get(); const data=cur.data();
  if(data.resultadosHex){
    const oldAcc=calcAcumuladoHex(data.resultadosHex);
    for(const idx of Object.keys(oldAcc)){
      const pr=data.parejas[idx];
      for(const rut of pr){ if(rut) await restarStats(rut, oldAcc[idx].s, oldAcc[idx].j, oldAcc[idx].jp, 1); }
    }
  }
  const resultadosHex=HEX_SCHEDULE.map((ronda,ri)=>ronda.map((_,ci)=>{
    const ja=+document.getElementById(`hx-${ri}-${ci}-a-${dia}`).value||0;
    const jb=+document.getElementById(`hx-${ri}-${ci}-b-${dia}`).value||0;
    return {juegosA:ja,juegosB:jb,ganador:ja>jb?'a':(jb>ja?'b':null)};
  }));
  await ref.set({...data, resultadosHex});
  await actualizarStatsHex(data.parejas, resultadosHex);
  render();
}

function calcAcumuladoHex(resultadosHex){
  const acc={};
  HEX_SCHEDULE.forEach((ronda,ri)=>{
    ronda.forEach(([a,b],ci)=>{
      const res=resultadosHex[ri][ci]; if(!res||res.ganador==null) return;
      acc[a]=acc[a]||{j:0,jp:0,s:0}; acc[b]=acc[b]||{j:0,jp:0,s:0};
      acc[a].j+=res.juegosA; acc[a].jp+=res.juegosB; if(res.ganador==='a') acc[a].s+=1;
      acc[b].j+=res.juegosB; acc[b].jp+=res.juegosA; if(res.ganador==='b') acc[b].s+=1;
    });
  });
  return acc;
}
async function actualizarStatsHex(parejas, resultadosHex){
  const acc=calcAcumuladoHex(resultadosHex);
  for(const idx of Object.keys(acc)){
    const pr=parejas[idx];
    for(const rut of pr){ if(rut) await sumarStats(rut, acc[idx].s, acc[idx].j, acc[idx].jp, 1); }
  }
}

async function sumarStats(rut,sets,juegos,juegosPerdidos,nPartidos){
  nPartidos=nPartidos||1;
  const ref=db.doc(`groups/${gid}/stats/${rut}`);
  const s=await ref.get(); const cur=s.exists?s.data():{sets:0,juegos:0,partidos:0,juegosPerdidos:0};
  await ref.set({sets:cur.sets+sets, juegos:cur.juegos+juegos, juegosPerdidos:(cur.juegosPerdidos||0)+juegosPerdidos, partidos:cur.partidos+nPartidos});
}
async function restarStats(rut,sets,juegos,juegosPerdidos,nPartidos){
  nPartidos=nPartidos||1;
  const ref=db.doc(`groups/${gid}/stats/${rut}`);
  const s=await ref.get(); const cur=s.exists?s.data():{sets:0,juegos:0,partidos:0,juegosPerdidos:0};
  await ref.set({
    sets:Math.max(0,cur.sets-sets), juegos:Math.max(0,cur.juegos-juegos),
    juegosPerdidos:Math.max(0,(cur.juegosPerdidos||0)-juegosPerdidos), partidos:Math.max(0,cur.partidos-nPartidos)
  });
}

async function renderStats(){
  const app=document.getElementById("app");
  if(isAdmin){
    const jugSnap=await db.collection(`groups/${gid}/jugadores`).get();
    const jugadores=jugSnap.docs.map(d=>d.data());
    const opts=jugadores.map(j=>`<option value="${j.rut}">${j.nombre} ${j.apellidos} (RUT ${j.rut})</option>`).join("");
    app.innerHTML=`<div class="card"><h3>Estadísticas por jugador</h3>
      <select id="st-rut" onchange="mostrarStat()">${opts}</select>
      <button class="btn del" onclick="borrarStatJugador()">Borrar estadística de este jugador</button>
      <div id="st-out"></div></div>`;
    if(jugadores.length) mostrarStat();
  } else if(me){
    app.innerHTML=`<div class="card"><h3>Mi clasificación</h3>
      <input type="hidden" id="st-rut" value="${me.rut}"><div id="st-out"></div></div>`;
    mostrarStat();
  } else {
    app.innerHTML=`<div class="card"><div class="msg">Ingresa como jugador o administrador para ver estadísticas.</div></div>`;
  }
}
async function borrarStatJugador(){
  const rut=document.getElementById("st-rut").value;
  const nombre=document.querySelector(`#st-rut option[value="${rut}"]`).textContent;
  if(!(await appConfirm(`¿Borrar toda la estadística de ${nombre}? Esta acción no se puede deshacer.`))) return;
  try{
    const ref=db.doc(`groups/${gid}/stats/${rut}`);
    await ref.delete();
    await new Promise(r=>setTimeout(r,300));
    const check=await ref.get();
    if(check.exists){
      appAlert("El documento de estadística sigue existiendo tras intentar borrarlo. Valores: "+JSON.stringify(check.data()),true);
      return;
    }
  }catch(err){
    appAlert("No se pudo borrar la estadística: "+((err&&err.message)||err),true);
    return;
  }
  appAlert(`Estadística de ${nombre} borrada correctamente.`);
  mostrarStat();
}

async function mostrarStat(){
  const rut=document.getElementById("st-rut").value;
  const s=await db.doc(`groups/${gid}/stats/${rut}`).get();
  const d=s.exists?s.data():{sets:0,juegos:0,partidos:0,juegosPerdidos:0};
  const totalJuegos=(d.juegos||0)+(d.juegosPerdidos||0);
  const pctG=totalJuegos?Math.round((d.juegos/totalJuegos)*100):0;
  const promJuegos=d.partidos?(d.juegos/d.partidos).toFixed(1):"0.0";
  const promSets=d.partidos?(d.sets/d.partidos).toFixed(1):"0.0";
  document.getElementById("st-out").innerHTML=`<table style="margin-top:10px">
    <tr><th>Partidos jugados</th><td>${d.partidos}</td></tr>
    <tr><th>Sets ganados</th><td>${d.sets}</td></tr>
    <tr><th>Juegos ganados</th><td>${d.juegos}</td></tr>
    <tr><th>Juegos perdidos</th><td>${d.juegosPerdidos||0}</td></tr>
    <tr><th>Promedio juegos ganados / partido</th><td>${promJuegos}</td></tr>
    <tr><th>Promedio sets ganados / partido</th><td>${promSets}</td></tr></table>
    ${totalJuegos?`<div style="display:flex;align-items:center;justify-content:center;gap:22px;margin-top:16px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:12px;text-align:left;min-width:125px">
        <div class="msg"><span style="color:#0057FF;font-size:18px;vertical-align:middle">●</span> <b>Ganados</b><div style="padding-left:22px;font-weight:800">${pctG}%</div></div>
        <div class="msg"><span style="color:#E5FF00;font-size:18px;vertical-align:middle">●</span> <b>Perdidos</b><div style="padding-left:22px;font-weight:800">${100-pctG}%</div></div>
      </div>
      <div aria-label="Gráfico de torta: juegos ganados y perdidos" style="flex:0 0 140px;width:140px;height:140px;border-radius:50%;background:conic-gradient(#0057FF 0% ${pctG}%, #E5FF00 ${pctG}% 100%);box-shadow:var(--shadow)"></div>
    </div>`:'<div class="msg">Aún no hay juegos registrados.</div>'}
    ${isAdmin?`<div class="msg" style="margin-top:14px;opacity:.6;font-size:11px">Depuración — ruta: groups/${gid}/stats/${rut} · documento existe: ${s.exists} · datos crudos: ${JSON.stringify(s.exists?s.data():null)}</div>`:''}`;
}
window.addEventListener("hashchange",render);
window.addEventListener("unhandledrejection", e=>{ appAlert("Ocurrió un error: "+((e.reason&&e.reason.message)||e.reason),true); });
init();
</script>
