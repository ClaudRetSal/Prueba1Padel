<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PADNET</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef4ff; --bg2:#e4edff; --card:#ffffff; --card-b:#dbe6ff;
  --txt:#0f1b3d; --mut:#5b6b93; --acc:#2563eb; --acc-d:#1e40af; --acc-soft:#dbe6ff;
  --amber:#f5b400; --amber-d:#b98600; --amber-soft:#fff3d1;
  --bad:#e0334f; --shadow:0 1px 2px rgba(15,27,61,.04),0 8px 24px -12px rgba(37,99,235,.18);
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1128; --bg2:#0d1638; --card:#121d42; --card-b:#22305f;
  --txt:#eef2ff; --mut:#93a2cf; --acc:#4d8dff; --acc-d:#2563eb; --acc-soft:#1b2b5e;
  --amber:#ffcc33; --amber-d:#f5b400; --amber-soft:#33290a;
  --bad:#ff5a72; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#0a1128; --bg2:#0d1638; --card:#121d42; --card-b:#22305f;
  --txt:#eef2ff; --mut:#93a2cf; --acc:#4d8dff; --acc-d:#2563eb; --acc-soft:#1b2b5e;
  --amber:#ffcc33; --amber-d:#f5b400; --amber-soft:#33290a;
  --bad:#ff5a72; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2) 340px);color:var(--txt);min-height:100%;-webkit-font-smoothing:antialiased}
header{padding:18px 20px;background:var(--card);border-bottom:1px solid var(--card-b);display:flex;justify-content:space-between;align-items:center;gap:14px;position:sticky;top:0;z-index:10;padding-top:calc(18px + env(safe-area-inset-top,0))}
header img{min-width:0;flex-shrink:1}
#ginfo{text-align:right;white-space:nowrap}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.02em;color:var(--acc-d)}
header h1 span{color:var(--amber-d)}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;background:transparent}
nav button{background:var(--card);border:1px solid var(--card-b);color:var(--mut);padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600;transition:all .15s ease;box-shadow:var(--shadow)}
nav button:hover{color:var(--acc-d);border-color:var(--acc)}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:8px 16px 32px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--card-b);background:var(--bg);color:var(--txt);font-size:14px;font-family:inherit;transition:border-color .15s}
input:focus,select:focus{outline:none;border-color:var(--acc)}
button.btn{background:var(--acc);border:none;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;margin-top:12px;transition:transform .1s,background .15s;box-shadow:0 4px 14px -4px rgba(37,99,235,.5)}
button.btn:hover{background:var(--acc-d)}
button.btn:active{transform:scale(.98)}
button.btn.sec{background:var(--amber-soft);border:1.5px solid var(--amber);color:var(--amber-d);box-shadow:none}
button.btn.sec:hover{background:var(--amber);color:#3a2c00}
button.btn.del{background:transparent;border:1.5px solid var(--bad);color:var(--bad);box-shadow:none}
button.btn.del:hover{background:var(--bad);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
th{color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
td,th{padding:9px 6px;border-bottom:1px solid var(--card-b);text-align:left}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--amber-soft);color:var(--amber-d);font-size:11px;font-weight:700}
.day{border:1.5px solid var(--card-b);border-left:4px solid var(--acc);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:var(--bg)}
.msg{color:var(--mut);font-size:13px}
.err{color:var(--bad);font-size:13px;font-weight:600}
h3{margin:0 0 10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.chk{display:flex;align-items:center;gap:8px;padding:5px 0}
.chk input{width:auto;accent-color:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(10,17,40,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
</style>
</head>

// Capa de compatibilidad: envuelve Firestore con la misma forma (doc/collection/get/set/delete)
// que usa el resto de la app, para no tener que tocar ninguna otra función.
function crearDbFirestore(firestore){
  return {
    doc(path){ return firestore.doc(path); },
    collection(path){ return firestore.collection(path); }
  };
}
const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DIA_KEYS={"Lunes":"lunes","Martes":"martes","Miércoles":"miercoles","Jueves":"jueves","Viernes":"viernes","Sábado":"sabado","Domingo":"domingo"};
function diaKey(dia){
  const parts=dia.split("__");
  const base=DIA_KEYS[parts[0]];
  return parts.length>1?`${base}_h${parts[1]}`:base;
}
const TIPOS={4:"Normal",8:"Cuadrangular",12:"Hexagonal",16:"Octogonal"};
const SETS_TIPO={"Normal":3,"Cuadrangular":3,"Hexagonal":5,"Octogonal":5};
const HEX_SCHEDULE=[
  [[0,5],[1,4],[2,3]],
  [[0,4],[5,3],[1,2]],
  [[0,3],[4,2],[5,1]],
  [[0,2],[3,1],[4,5]],
  [[0,1],[2,5],[3,4]]
];

function weekKey(){const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+7);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fechasSemana(wk){const [y,m,dd]=wk.split("-").map(Number);const base=new Date(y,m-1,dd);
  return DIAS.map((nombre,i)=>{const f=new Date(base);f.setDate(base.getDate()+i);
    return {nombre,fecha:f,label:`${nombre} ${String(f.getDate()).padStart(2,'0')}/${String(f.getMonth()+1).padStart(2,'0')}`};});}
function uid(n=6){return Math.random().toString(36).slice(2,2+n).toUpperCase();}
function appAlert(msg,isError){
  const root=document.getElementById("modal-root");
  root.innerHTML=`<div class="ov"><div class="card" style="max-width:380px;margin:0">
    <div class="${isError?'err':'msg'}" style="margin-bottom:14px;white-space:pre-wrap">${msg}</div>
    <button class="btn" onclick="document.getElementById('modal-root').innerHTML=''">Aceptar</button>
  </div></div>`;
}
function appConfirm(msg){
  return new Promise(resolve=>{
    const root=document.getElementById("modal-root");
    root.innerHTML=`<div class="ov"><div class="card" style="max-width:380px;margin:0">
      <div class="msg" style="margin-bottom:14px;white-space:pre-wrap">${msg}</div>
      <div class="row">
        <button class="btn sec" id="modal-cancel" style="flex:1">Cancelar</button>
        <button class="btn del" id="modal-ok" style="flex:1">Confirmar</button>
      </div>
    </div></div>`;
    document.getElementById("modal-ok").onclick=()=>{root.innerHTML="";resolve(true);};
    document.getElementById("modal-cancel").onclick=()=>{root.innerHTML="";resolve(false);};
  });
}
function horaOptions(){const o=[];for(let h=0;h<24;h++)for(const m of [0,30])o.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);return o;}

async function init(){
  try{
    const app = firebase.initializeApp(firebaseConfig);
    const firestore = firebase.firestore();
    db = crearDbFirestore(firestore);
  }catch(e){ console.error(e); db=null; }
  render();
}

function setTab(t){ location.hash=t; render(); }
function nav(){
  const tabs = gid? [["reservas","Reservas"],["resultados","Resultados"],["stats","Estadísticas"]] : [];
  const base = [["inicio","Inicio"]].concat(tabs).concat(gid&&isAdmin?[["jugadores","Jugadores"]]:[]);
  document.getElementById("nav").innerHTML = base.map(([k,l])=>`<button onclick="setTab('${k}')" class="${(location.hash.slice(1)||'inicio')===k?'on':''}">${l}</button>`).join("");
  document.getElementById("ginfo").innerHTML = group? `<div>Grupo: ${group.nombre}</div><div>ID: ${gid}${isAdmin?' · Admin':me?` · ${me.nombre}`:''}</div>` : "";
}

async function render(){
  nav();
  const tab = location.hash.slice(1) || "inicio";
  const app = document.getElementById("app");
  if(!db){ app.innerHTML = `<div class="card err">No se pudo conectar a la base de datos compartida. Recarga la página.</div>`; return; }
  try{
    if(tab==="inicio") return await renderInicio();
    if(!gid){ location.hash="inicio"; return await renderInicio(); }
    if(tab==="jugadores") return await renderJugadores();
    if(tab==="reservas") return await renderReservas();
    if(tab==="resultados") return await renderResultados();
    if(tab==="stats") return await renderStats();
  }catch(err){
    console.error(err);
    app.innerHTML = `<div class="card err">Ocurrió un error al cargar esta sección (${(err&&err.message)||err}). Intenta recargar la página.</div>`;
  }
}

function renderInicio(){
  document.getElementById("app").innerHTML = `
  <div class="card"><h3>Ingresar a un grupo</h3>
    <label>ID del grupo</label><input id="ig-id" style="text-transform:uppercase">
    <label>Clave (admin o jugador)</label><input id="ig-clave" type="password">
    <label>Si eres jugador, tu RUT (dejar vacío si eres admin)</label><input id="ig-rut">
    <button class="btn" onclick="ingresarGrupo()">Ingresar</button>
    <div id="ig-msg" class="err"></div>
  </div>`;
}

async function cargarListaGrupos(){
  const cont=document.getElementById("lista-grupos");
  if(!cont) return;
  const snap=await db.collection("groups").get();
  if(!snap.docs.length){ cont.innerHTML=`<h3>Grupos existentes</h3><div class="msg">Aún no hay grupos creados.</div>`; return; }
  cont.innerHTML=`<h3>Grupos existentes (${snap.docs.length})</h3><table>
    <tr><th>Nombre</th><th>ID</th><th>Clave admin</th><th></th></tr>
    ${snap.docs.map(d=>`<tr><td>${d.data().nombre}</td><td>${d.id}</td><td>${d.data().claveAdmin}</td>
      <td><button class="btn del" onclick="borrarGrupoCompleto('${d.id}')">Borrar grupo</button></td></tr>`).join("")}
    </table>`;
}

async function exportarDatosGrupo(){
  const data={grupo:null,jugadores:[],reservas:[],partidos:[],stats:[]};
  const gSnap=await db.doc(`groups/${gid}`).get();
  data.grupo=gSnap.exists?{id:gid,...gSnap.data()}:null;
  for(const sub of ["jugadores","reservas","partidos","stats"]){
    const snap=await db.collection(`groups/${gid}/${sub}`).get();
    data[sub]=snap.docs.map(d=>({id:d.id,...d.data()}));
  }
  try{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`padnet-${gid}-backup.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(err){
    appAlert("No se pudo descargar el respaldo: "+((err&&err.message)||err),true);
  }
}

async function importarDatosGrupo(input){
  const file=input.files[0]; if(!file) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    const idDestino=data.grupo?.id || gid;
    if(data.grupo){ const {id,...gdata}=data.grupo; await db.doc(`groups/${idDestino}`).set(gdata); }
    for(const sub of ["jugadores","reservas","partidos","stats"]){
      for(const doc of (data[sub]||[])){ const {id,...ddata}=doc; await db.doc(`groups/${idDestino}/${sub}/${id}`).set(ddata); }
    }
    appAlert(`Datos importados correctamente al grupo ${idDestino}.`);
    render();
  }catch(err){
    appAlert("No se pudo importar el archivo: "+((err&&err.message)||err),true);
  }
}

async function borrarGrupoCompleto(id){
  if(!(await appConfirm(`¿Borrar por completo el grupo ${id}? Esto eliminará jugadores, reservas, partidos y estadísticas. Esta acción no se puede deshacer.`))) return;
  try{
    for(const sub of ["jugadores","reservas","partidos","stats"]){
      const snap=await db.collection(`groups/${id}/${sub}`).get();
      for(const d of snap.docs){ await db.doc(`groups/${id}/${sub}/${d.id}`).delete(); }
    }
    await db.doc(`groups/${id}`).delete();
    const check=await db.doc(`groups/${id}`).get();
    if(check.exists){ appAlert("El grupo no se pudo borrar (sigue existiendo tras el intento). Puede ser un problema de permisos de edición sobre esta página.",true); return; }
    if(gid===id){ gid=null; group=null; me=null; isAdmin=false; }
  }catch(err){
    appAlert("No se pudo borrar el grupo: "+((err&&err.message)||err),true);
    return;
  }
  render();
}

async function crearGrupo(){
  const nombre=document.getElementById("ng-nombre").value.trim();
  const clave=document.getElementById("ng-clave").value;
  if(!nombre||!clave){document.getElementById("ng-msg").textContent="Completa nombre y clave.";return;}
  const id=uid();
  await db.doc(`groups/${id}`).set({nombre,claveAdmin:clave,createdAt:Date.now()});
  gid=id; group={nombre,claveAdmin:clave}; isAdmin=true; me=null;
  location.hash="jugadores"; render();
}

async function ingresarGrupo(){
  const id=document.getElementById("ig-id").value.trim().toUpperCase();
  const clave=document.getElementById("ig-clave").value;
  const rut=document.getElementById("ig-rut").value.trim();
  const msg=document.getElementById("ig-msg");
  if(!id||!clave){msg.textContent="Completa ID y clave.";return;}
  const snap=await db.doc(`groups/${id}`).get();
  if(!snap.exists){msg.textContent="Grupo no encontrado.";return;}
  const g=snap.data();
  if(!rut){
    if(clave!==g.claveAdmin){msg.textContent="Clave de administrador incorrecta.";return;}
    gid=id;group=g;isAdmin=true;me=null;location.hash="jugadores";render();return;
  }
  const jsnap=await db.doc(`groups/${id}/jugadores/${rut}`).get();
  if(!jsnap.exists||jsnap.data().clave!==clave){msg.textContent="RUT o clave incorrectos.";return;}
  gid=id;group=g;isAdmin=false;me=jsnap.data();location.hash="reservas";render();
}

async function guardarHorarios(){
  const h1=document.getElementById("h1").value, h2=document.getElementById("h2").value;
  const ref=db.doc(`groups/${gid}`);
  const cur=await ref.get(); const data=cur.exists?cur.data():{};
  await ref.set({...data, horarios:[h1,h2]});
  group={...group, horarios:[h1,h2]};
  render();
}

async function agregarJugador(){
  const g=id=>document.getElementById(id).value.trim();
  const rut=g("j-rut");
  if(!rut||!g("j-nombre")||!g("j-clave")){document.getElementById("j-msg").textContent="Completa nombre, RUT y clave.";return;}
  await db.doc(`groups/${gid}/jugadores/${rut}`).set({
    nombre:g("j-nombre"),apellidos:g("j-apellidos"),rut,telefono:g("j-telefono"),
    categoria:g("j-categoria"),nivel:document.getElementById("j-nivel").value,
    posicion:document.getElementById("j-posicion").value,clave:g("j-clave")});
  const statsRef=db.doc(`groups/${gid}/stats/${rut}`);
  const statsSnap=await statsRef.get();
  if(!statsSnap.exists) await statsRef.set({sets:0,juegos:0,partidos:0});
  render();
}
async function borrarJugador(rut){ await db.doc(`groups/${gid}/jugadores/${rut}`).delete(); render(); }

async function renderReservas(){
  const app=document.getElementById("app");
  const wk=weekKey();
  const cal=fechasSemana(wk);
  const jugSnap=await db.collection(`groups/${gid}/jugadores`).get();
  const jugadores={}; jugSnap.docs.forEach(d=>jugadores[d.data().rut]=d.data());
  const gSnap=await db.doc(`groups/${gid}`).get();
  const horarios=(gSnap.exists?gSnap.data().horarios:null)||[];
  const nombreHeader=`<div class="card"><b>${isAdmin?'Administrador':(me?`${me.nombre} ${me.apellidos||''}`.trim():'')}</b></div>`;
  let inscHtml="";
  if(me){
    const my=[];
    const myHor=[]; // myHor[i] = [bool horario0, bool horario1] para el día i
    for(let i=0;i<7;i++){
      const dia=DIAS[i];
      const rs=await db.doc(`groups/${gid}/reservas/${wk}_${diaKey(dia)}`).get();
      my.push(rs.exists && (rs.data().ruts||[]).includes(me.rut));
      const horMap=(rs.exists && rs.data().horarios)||{};
      myHor.push(horarios.map((_,h)=> (horMap[me.rut]||[])[h]===true ));
    }
    inscHtml=`<div class="card"><h3>Calendario próxima semana — marca los días que jugarás</h3>
      ${cal.map((c,i)=>`<div class="chk" style="flex-wrap:wrap;justify-content:space-between;border-bottom:1px solid var(--card-b);padding:8px 0">
        <label style="display:flex;align-items:center;gap:8px;margin:0"><input type="checkbox" id="dia-${i}" ${my[i]?'checked':''}> <b>${c.label}</b></label>
        ${horarios.length?`<span style="display:flex;gap:12px">${horarios.map((h,hi)=>`<label class="chk" style="display:inline-flex;margin:0"><input type="checkbox" id="dia-${i}-hor-${hi}" ${myHor[i][hi]?'checked':''}> ${h}</label>`).join("")}</span>`:''}
        </div>`).join("")}
      <button class="btn" onclick="guardarReserva('${wk}')">Guardar mi disponibilidad</button><div id="r-msg" class="err"></div></div>`;
  }
  function renderSesionHtml(wk,sesion,label,ruts,jugadores,isAdmin){
    const n=ruts.length;
    const cupo=n>=16?16:n>=12?12:n>=8?8:n>=4?4:0;
    const tipo=cupo?TIPOS[cupo]:null;
    const nombres=ruts.map(r=>jugadores[r]?`${jugadores[r].nombre} ${(jugadores[r].apellidos||'').charAt(0).toUpperCase()}. (${jugadores[r].posicion})`:r);
    return (async()=>{
      const partSnap=await db.doc(`groups/${gid}/partidos/${wk}_${diaKey(sesion)}`).get();
      const pdata=partSnap.exists?partSnap.data():{};
      const activo=!!pdata.activo;
      const parejas=pdata.parejas||[];
      let out=`<div class="day"><b>${label}</b> — ${n} jugador(es) ${tipo?`<span class="tag">${tipo}</span>`:''} ${activo?`<span class="tag">Activado${pdata.modalidad==='grupal'?' · Grupal':''}</span>`:''}
        ${isAdmin && (activo||parejas.length)?`<button class="btn del" style="padding:3px 8px;margin-left:6px" onclick="borrarDia('${wk}','${sesion}')">Borrar resultados</button>`:''}
        <div class="msg">${nombres.join(", ")||'Sin inscritos'}</div>`;
      if(isAdmin && tipo && !activo){
        if(tipo==='Cuadrangular'||tipo==='Octogonal'||tipo==='Hexagonal'){
          let hint = tipo==='Octogonal'?' (2 cuadrangulares de 2 canchas c/u)':tipo==='Hexagonal'?' (3 canchas, round-robin de 5 rondas)':' (2 canchas)';
          out+=`<div class="msg" style="margin-top:6px">Modalidad del encuentro:</div>
          <select id="mod-${sesion}"><option value="individual">Partido individual</option><option value="grupal">Partido grupal${hint}</option></select>
          <button class="btn" onclick="activarDia('${wk}','${sesion}','${tipo}',document.getElementById('mod-${sesion}').value)">Activar</button>`;
        } else {
          out+=`<button class="btn" onclick="activarDia('${wk}','${sesion}','${tipo}','individual')">Activar</button>`;
        }
      } else if(isAdmin && !tipo && n>0){
        out+=`<div class="msg" style="margin-top:4px">Faltan jugadores para activar (mínimo 4).</div>`;
      }
      if(isAdmin && activo && n>=4){
        const nPares=Math.floor(n/4)*2;
        const emparejados=new Set(parejas.flat().filter(Boolean));
        const disponibles=ruts.filter(r=>!emparejados.has(r));
        out+=`<div style="margin-top:8px"><b>Formar parejas (${parejas.length}/${nPares})</b>
          <div class="msg">Parejas formadas:</div>
          ${parejas.length?parejas.map((pr,i)=>`<div class="chk">${(pdata.tipo==='Octogonal'&&pdata.modalidad==='grupal')?`<b>Cuadrangular ${Math.floor(i/4)+1}</b> — `:''}${jugadores[pr[0]]?jugadores[pr[0]].nombre:pr[0]} / ${jugadores[pr[1]]?jugadores[pr[1]].nombre:pr[1]}
            <button class="btn del" style="margin:0 0 0 8px;padding:3px 8px" onclick="quitarPareja('${wk}','${sesion}',${i})">Quitar</button></div>`).join(""):'<div class="msg">Ninguna aún</div>'}
          ${parejas.length<nPares?`<div class="msg" style="margin-top:8px">Selecciona 2 jugadores disponibles:</div>
          ${disponibles.map(r=>`<label class="chk"><input type="checkbox" class="jc-${sesion}" value="${r}"> ${jugadores[r]?jugadores[r].nombre:r} (${jugadores[r]?jugadores[r].posicion:''})</label>`).join("")}
          <button class="btn" onclick="formarPareja('${wk}','${sesion}')">Formar pareja</button><div id="pp-msg-${sesion}" class="err"></div>`:'<div class="msg">Todas las parejas están formadas.</div>'}
        </div>`;
      }
      out+="</div>";
      return out;
    })();
  }
  let diasHtml="";
  for(const dia of DIAS){
    const cLabel=cal.find(c=>c.nombre===dia).label;
    const rs=await db.doc(`groups/${gid}/reservas/${wk}_${diaKey(dia)}`).get();
    const ruts=rs.exists?(rs.data().ruts||[]):[];
    const horMapDia=(rs.exists && rs.data().horarios)||{};
    if(horarios.length===0){
      if(ruts.length>0) diasHtml+=await renderSesionHtml(wk,dia,cLabel,ruts,jugadores,isAdmin);
    } else {
      const bloquesHor=[];
      for(let h=0;h<horarios.length;h++){
        const rutsH=ruts.filter(r=>(horMapDia[r]||[])[h]===true);
        if(rutsH.length>0) bloquesHor.push(await renderSesionHtml(wk,`${dia}__${h}`,`${horarios[h]}`,rutsH,jugadores,isAdmin));
      }
      if(bloquesHor.length){
        diasHtml+=`<div class="msg" style="margin:10px 0 2px;font-weight:700">${cLabel}</div>`+bloquesHor.join("");
      }
    }
  }
  if(!diasHtml) diasHtml=`<div class="msg">Todavía no hay jugadores inscritos esta semana.</div>`;
  const rango=`${cal[0].label} al ${cal[6].label}`;
  app.innerHTML = nombreHeader + inscHtml + `<div class="card"><h3>Partidos de la semana (${rango})</h3>${diasHtml}</div>`;
}

async function guardarReserva(wk){
  const gSnap=await db.doc(`groups/${gid}`).get();
  const nHor=((gSnap.exists?gSnap.data().horarios:null)||[]).length;
  for(let i=0;i<7;i++){
    const dia=DIAS[i]; const checked=document.getElementById(`dia-${i}`).checked;
    const ref=db.doc(`groups/${gid}/reservas/${wk}_${diaKey(dia)}`);
    const cur=await ref.get();
    let ruts=cur.exists?(cur.data().ruts||[]):[];
    let horariosMap=cur.exists?{...(cur.data().horarios||{})}:{};
    ruts=ruts.filter(r=>r!==me.rut);
    delete horariosMap[me.rut];
    if(checked){
      ruts.push(me.rut);
      const sel=[];
      for(let h=0;h<nHor;h++) sel.push(!!document.getElementById(`dia-${i}-hor-${h}`) && document.getElementById(`dia-${i}-hor-${h}`).checked);
      horariosMap[me.rut]=sel;
    }
    await ref.set({dia,ruts,horarios:horariosMap});
  }
  render();
}

async function borrarDia(wk,dia){
  if(!(await appConfirm(`¿Borrar todos los resultados y configuración de ${dia}? Esta acción no se puede deshacer.`))) return;
  const ref=db.doc(`groups/${gid}/partidos/${wk}_${diaKey(dia)}`);
  await ref.delete();
  render();
}

async function activarDia(wk,dia,tipo,modalidad){
  const ref=db.doc(`groups/${gid}/partidos/${wk}_${diaKey(dia)}`);
  const cur=await ref.get();
  const data=cur.exists?cur.data():{};
  await ref.set({activo:true, tipo, modalidad:modalidad||'individual', parejas:data.parejas||[], resultados:data.resultados||[], rondas:data.rondas||null});
  render();
}

async function formarPareja(wk,dia){
  const sel=[...document.querySelectorAll(`.jc-${dia}:checked`)].map(c=>c.value);
  const msg=document.getElementById(`pp-msg-${dia}`);
  if(sel.length!==2){ if(msg) msg.textContent="Selecciona exactamente 2 jugadores."; return; }
  const ref=db.doc(`groups/${gid}/partidos/${wk}_${diaKey(dia)}`);
  const cur=await ref.get(); const data=cur.exists?cur.data():{};
  const parejas=(data.parejas||[]).concat([sel]);
  await ref.set({activo:true, tipo:data.tipo||null, modalidad:data.modalidad||'individual', parejas, resultados:data.resultados||[], rondas:data.rondas||null});
  render();
}
async function quitarPareja(wk,dia,idx){
  const ref=db.doc(`groups/${gid}/partidos/${wk}_${diaKey(dia)}`);
  const cur=await ref.get(); const data=cur.exists?cur.data():{};
  const parejas=(data.parejas||[]).filter((_,i)=>i!==idx);
  await ref.set({activo:false, tipo:data.tipo||null, modalidad:data.modalidad||'individual', parejas, resultados:[], rondas:null});
  render();
}

async function guardarRonda1(wk,dia){
  const ref=db.doc(`groups/${gid}/partidos/${wk}_${diaKey(dia)}`);
  const cur=await ref.get(); const data=cur.data();
  const a1=+document.getElementById(`g-c1a-${dia}`).value||0, b1=+document.getElementById(`g-c1b-${dia}`).value||0;
  const a2=+document.getElementById(`g-c2a-${dia}`).value||0, b2=+document.getElementById(`g-c2b-${dia}`).value||0;
  const c1={a:0,b:1,juegosA:a1,juegosB:b1,ganador:a1>b1?'a':(b1>a1?'b':null)};
  const c2={a:2,b:3,juegosA:a2,juegosB:b2,ganador:a2>b2?'a':(b2>a2?'b':null)};
  const winC1=c1.ganador==='a'?c1.a:c1.b, loseC1=c1.ganador==='a'?c1.b:c1.a;
  const winC2=c2.ganador==='a'?c2.a:c2.b, loseC2=c2.ganador==='a'?c2.b:c2.a;
  const ronda2={cancha1:{a:winC1,b:loseC2,juegosA:0,juegosB:0,ganador:null}, cancha2:{a:winC2,b:loseC1,juegosA:0,juegosB:0,ganador:null}};
  await ref.set({...data, rondas:[{cancha1:c1,cancha2:c2}, ronda2]});
  render();
}

function calcRonda3(round1, round2){
  const key=(a,b)=>a<b?`${a}-${b}`:`${b}-${a}`;
  const jugados=new Set([
    key(round1.cancha1.a,round1.cancha1.b), key(round1.cancha2.a,round1.cancha2.b),
    key(round2.cancha1.a,round2.cancha1.b), key(round2.cancha2.a,round2.cancha2.b)
  ]);
  const todas=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
  const faltantes=todas.filter(([a,b])=>!jugados.has(key(a,b)));
  return {cancha1:{a:faltantes[0][0],b:faltantes[0][1],juegosA:0,juegosB:0,ganador:null},
          cancha2:{a:faltantes[1][0],b:faltantes[1][1],juegosA:0,juegosB:0,ganador:null}};
}

function calcAcumuladoGrupal(rondas){
  const acc={};
  for(const rd of rondas){
    for(const ck of ['cancha1','cancha2']){
      const c=rd[ck]; if(c.ganador==null) continue;
      acc[c.a]=acc[c.a]||{j:0,jp:0,s:0}; acc[c.b]=acc[c.b]||{j:0,jp:0,s:0};
      acc[c.a].j+=c.juegosA; acc[c.a].jp+=c.juegosB; if(c.ganador==='a') acc[c.a].s+=1;
      acc[c.b].j+=c.juegosB; acc[c.b].jp+=c.juegosA; if(c.ganador==='b') acc[c.b].s+=1;
    }
  }
  return acc;
}
async function actualizarStatsGrupal(parejas, rondas){
  const acc=calcAcumuladoGrupal(rondas);
  for(const idx of Object.keys(acc)){
    const pr=parejas[idx];
    for(const rut of pr){ if(rut) await sumarStats(rut, acc[idx].s, acc[idx].j, acc[idx].jp, 1); }
  }
}

async function guardarResultados(wk,dia,nPartidos,nSets){
  const ref=db.doc(`groups/${gid}/partidos/${wk}_${diaKey(dia)}`);
  const snap=await ref.get(); const data=snap.data(); const parejas=data.parejas;
  const oldResultados=data.resultados||[];
  for(let p=0;p<nPartidos;p++){
    const old=oldResultados[p];
    if(old && old.ganador){
      const pa=parejas[p*2], pb=parejas[p*2+1];
      for(const rut of pa){ if(rut) await restarStats(rut,old.setsA||0,old.juegosA||0,old.juegosB||0); }
      for(const rut of pb){ if(rut) await restarStats(rut,old.setsB||0,old.juegosB||0,old.juegosA||0); }
    }
  }
  const resultados=[];
  for(let p=0;p<nPartidos;p++){
    const sets=[]; let setsA=0,setsB=0,juegosA=0,juegosB=0;
    for(let si=0;si<nSets;si++){
      const a=+document.getElementById(`s${si}a-${dia}-${p}`).value||0;
      const b=+document.getElementById(`s${si}b-${dia}-${p}`).value||0;
      sets.push({a,b}); juegosA+=a; juegosB+=b;
      if(a!==b || a>0 || b>0){ if(a>b) setsA++; else if(b>a) setsB++; }
    }
    let ganador = setsA>setsB?'A':setsB>setsA?'B':null;
    resultados.push({sets,setsA,setsB,juegosA,juegosB,ganador});
    const pa=parejas[p*2], pb=parejas[p*2+1];
    for(const rut of pa){ if(rut) await sumarStats(rut,setsA,juegosA,juegosB); }
    for(const rut of pb){ if(rut) await sumarStats(rut,setsB,juegosB,juegosA); }
  }
  await ref.set({parejas,resultados});
  render();
}
async function guardarHexagonal(wk,dia){
  const ref=db.doc(`groups/${gid}/partidos/${wk}_${diaKey(dia)}`);
  const cur=await ref.get(); const data=cur.data();
  if(data.resultadosHex){
    const oldAcc=calcAcumuladoHex(data.resultadosHex);
    for(const idx of Object.keys(oldAcc)){
      const pr=data.parejas[idx];
      for(const rut of pr){ if(rut) await restarStats(rut, oldAcc[idx].s, oldAcc[idx].j, oldAcc[idx].jp, 1); }
    }
  }
  const resultadosHex=HEX_SCHEDULE.map((ronda,ri)=>ronda.map((_,ci)=>{
    const ja=+document.getElementById(`hx-${ri}-${ci}-a-${dia}`).value||0;
    const jb=+document.getElementById(`hx-${ri}-${ci}-b-${dia}`).value||0;
    return {juegosA:ja,juegosB:jb,ganador:ja>jb?'a':(jb>ja?'b':null)};
  }));
  await ref.set({...data, resultadosHex});
  await actualizarStatsHex(data.parejas, resultadosHex);
  render();
}

function calcAcumuladoHex(resultadosHex){
  const acc={};
  HEX_SCHEDULE.forEach((ronda,ri)=>{
    ronda.forEach(([a,b],ci)=>{
      const res=resultadosHex[ri][ci]; if(!res||res.ganador==null) return;
      acc[a]=acc[a]||{j:0,jp:0,s:0}; acc[b]=acc[b]||{j:0,jp:0,s:0};
      acc[a].j+=res.juegosA; acc[a].jp+=res.juegosB; if(res.ganador==='a') acc[a].s+=1;
      acc[b].j+=res.juegosB; acc[b].jp+=res.juegosA; if(res.ganador==='b') acc[b].s+=1;
    });
  });
  return acc;
}
async function actualizarStatsHex(parejas, resultadosHex){
  const acc=calcAcumuladoHex(resultadosHex);
  for(const idx of Object.keys(acc)){
    const pr=parejas[idx];
    for(const rut of pr){ if(rut) await sumarStats(rut, acc[idx].s, acc[idx].j, acc[idx].jp, 1); }
  }
}

async function sumarStats(rut,sets,juegos,juegosPerdidos,nPartidos){
  nPartidos=nPartidos||1;
  const ref=db.doc(`groups/${gid}/stats/${rut}`);
  const s=await ref.get(); const cur=s.exists?s.data():{sets:0,juegos:0,partidos:0,juegosPerdidos:0};
  await ref.set({sets:cur.sets+sets, juegos:cur.juegos+juegos, juegosPerdidos:(cur.juegosPerdidos||0)+juegosPerdidos, partidos:cur.partidos+nPartidos});
}
async function restarStats(rut,sets,juegos,juegosPerdidos,nPartidos){
  nPartidos=nPartidos||1;
  const ref=db.doc(`groups/${gid}/stats/${rut}`);
  const s=await ref.get(); const cur=s.exists?s.data():{sets:0,juegos:0,partidos:0,juegosPerdidos:0};
  await ref.set({
    sets:Math.max(0,cur.sets-sets), juegos:Math.max(0,cur.juegos-juegos),
    juegosPerdidos:Math.max(0,(cur.juegosPerdidos||0)-juegosPerdidos), partidos:Math.max(0,cur.partidos-nPartidos)
  });
}

async function renderStats(){
  const app=document.getElementById("app");
  if(isAdmin){
    const jugSnap=await db.collection(`groups/${gid}/jugadores`).get();
    const jugadores=jugSnap.docs.map(d=>d.data());
    const opts=jugadores.map(j=>`<option value="${j.rut}">${j.nombre} ${j.apellidos} (RUT ${j.rut})</option>`).join("");
    app.innerHTML=`<div class="card"><h3>Estadísticas por jugador</h3>
      <select id="st-rut" onchange="mostrarStat()">${opts}</select>
      <button class="btn del" onclick="borrarStatJugador()">Borrar estadística de este jugador</button>
      <div id="st-out"></div></div>`;
    if(jugadores.length) mostrarStat();
  } else if(me){
    app.innerHTML=`<div class="card"><h3>Mi clasificación</h3>
      <input type="hidden" id="st-rut" value="${me.rut}"><div id="st-out"></div></div>`;
    mostrarStat();
  } else {
    app.innerHTML=`<div class="card"><div class="msg">Ingresa como jugador o administrador para ver estadísticas.</div></div>`;
  }
}
async function borrarStatJugador(){
  const rut=document.getElementById("st-rut").value;
  const nombre=document.querySelector(`#st-rut option[value="${rut}"]`).textContent;
  if(!(await appConfirm(`¿Borrar toda la estadística de ${nombre}? Esta acción no se puede deshacer.`))) return;
  try{
    const ref=db.doc(`groups/${gid}/stats/${rut}`);
    await ref.delete();
    await new Promise(r=>setTimeout(r,300));
    const check=await ref.get();
    if(check.exists){
      appAlert("El documento de estadística sigue existiendo tras intentar borrarlo. Valores: "+JSON.stringify(check.data()),true);
      return;
    }
  }catch(err){
    appAlert("No se pudo borrar la estadística: "+((err&&err.message)||err),true);
    return;
  }
  appAlert(`Estadística de ${nombre} borrada correctamente.`);
  mostrarStat();
}

async function mostrarStat(){
  const rut=document.getElementById("st-rut").value;
  const s=await db.doc(`groups/${gid}/stats/${rut}`).get();
  const d=s.exists?s.data():{sets:0,juegos:0,partidos:0,juegosPerdidos:0};
  const totalJuegos=(d.juegos||0)+(d.juegosPerdidos||0);
  const pctG=totalJuegos?Math.round((d.juegos/totalJuegos)*100):0;
  const promJuegos=d.partidos?(d.juegos/d.partidos).toFixed(1):"0.0";
  const promSets=d.partidos?(d.sets/d.partidos).toFixed(1):"0.0";
  document.getElementById("st-out").innerHTML=`<table style="margin-top:10px">
    <tr><th>Partidos jugados</th><td>${d.partidos}</td></tr>
    <tr><th>Sets ganados</th><td>${d.sets}</td></tr>
    <tr><th>Juegos ganados</th><td>${d.juegos}</td></tr>
    <tr><th>Juegos perdidos</th><td>${d.juegosPerdidos||0}</td></tr>
    <tr><th>Promedio juegos ganados / partido</th><td>${promJuegos}</td></tr>
    <tr><th>Promedio sets ganados / partido</th><td>${promSets}</td></tr></table>
    ${totalJuegos?`<div style="text-align:center;margin-top:12px">
      <div style="width:140px;height:140px;border-radius:50%;margin:0 auto;background:conic-gradient(var(--acc) 0% ${pctG}%, var(--amber) ${pctG}% 100%);box-shadow:var(--shadow)"></div>
      <div class="msg" style="margin-top:10px"><span style="color:var(--acc)">●</span> Ganados ${pctG}% &nbsp;&nbsp; <span style="color:var(--amber-d)">●</span> Perdidos ${100-pctG}%</div>
    </div>`:'<div class="msg">Aún no hay juegos registrados.</div>'}
    ${isAdmin?`<div class="msg" style="margin-top:14px;opacity:.6;font-size:11px">Depuración — ruta: groups/${gid}/stats/${rut} · documento existe: ${s.exists} · datos crudos: ${JSON.stringify(s.exists?s.data():null)}</div>`:''}`;
}
window.addEventListener("hashchange",render);
window.addEventListener("unhandledrejection", e=>{ appAlert("Ocurrió un error: "+((e.reason&&e.reason.message)||e.reason),true); });
init();
</script>
</body>
